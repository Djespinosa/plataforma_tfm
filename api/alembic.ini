# Migraciones del esquema de PostgreSQL. Desde la raíz del repositorio: alembic -c api/alembic.ini upgrade head
# La URL sale de DATABASE_URL (entorno o .env); nunca se escribe aquí.
[alembic]
script_location = %(here)s/migraciones
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
